name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
            tauriScript: bash scripts/tauri-build.sh
          - platform: windows-latest
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            build-essential \
            curl wget file patchelf

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Add macOS arm64 target
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.platform }}

      - name: Install JS dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "The Cabinet ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            The Cabinet ${{ github.event.inputs.tag || github.ref_name }}

            Download the installer for your OS:
            - **macOS (Apple Silicon)**: `.dmg`
            - **Windows**: `*-setup.exe` (NSIS)
            - **Linux**: `.AppImage` or `.deb`

            Already running The Cabinet? It offers this update in-app, so a
            re-download is only needed for the first install or for Linux `.deb`
            installs (the AppImage self-updates).

            These builds are not notarized. On macOS the app is ad-hoc signed,
            so a freshly downloaded copy is quarantined and shows "unidentified
            developer": right-click the app and choose Open, or use System
            Settings -> Privacy & Security -> Open Anyway. If it instead says
            "damaged and can't be opened", run
            `xattr -cr "/Applications/The Cabinet.app"` and re-open.
            On Windows, choose "More info" -> "Run anyway" at the SmartScreen
            prompt.
          releaseDraft: true
          prerelease: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}
          tauriScript: ${{ matrix.tauriScript }}

      - name: Verify macOS bundle signature
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          DMG="$(find src-tauri/target -name '*.dmg' -path '*release/bundle*' | head -n1)"
          if [ -z "$DMG" ]; then
            echo "::error::could not find the built .dmg"
            exit 1
          fi
          echo "checking $DMG"
          MOUNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" >/dev/null' EXIT
          APP="$MOUNT/The Cabinet.app"
          test -d "$APP/Contents/_CodeSignature" || {
            echo "::error::$APP has no _CodeSignature (bundle was not signed)"
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$APP"
